<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UFT-8">
    <title>Post Your Hustle</title>
    <link rel="stylesheet" href="styles.css"
</head>
<body>

    <header>
        <nav class="navbar">
            <h1>Post Your Hustle</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="marketplace.html">Marketplace</a></li>
            </ul>
        </nav>
    </header>

    <section class="post-form">
        <h2>Grow Your Hustle</h2>
        <p>Fill in your business details and reach more customers.</p>

        <form>

            <input type="text" placeholder="Business Name" required>

            <input type="text" placeholder="Owner Name" required>

            <select required>
                <option value="">Choose Category</option>
                <option>Photography</option>
                <option>Design</option>
                <option>Tech</option>
                <option>Fashion</option>
            </select>

            <input type="nummber" placeholder="Starting price" required>

            <input type="text" placeholder="Location" required>

            <input type="tel" placeholder="Phone Number" required>

            <textarea placeholder="Describe your hustle..." rows="5" required></textarea>

            <button type="submit">Post My Hustle</button>
        </form>
    </section>

    <footer>
        <p>&copy 2026 Hustle Marketplace</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
